# The fork's check: the engine's tests on Linux and on a Mac (the Mac has its own speaker-finding code).
# PlayOnAir's format, lint and supply-chain gates are not run here yet: the Home.io Bridge changes have not been put
# through them.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: TZ=UTC cargo test --workspace --all-features
